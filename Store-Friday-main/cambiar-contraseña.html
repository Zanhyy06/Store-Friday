<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" href="./Css/normalize.css">
    <link rel="stylesheet" href="./Css/stely.css">
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
</head>
<body>
    <form id="form-cambiar" class="formulario-pro">
        <section>
            <h2>Cambia tu contraseña</h2>
            <div>
                <input type="password" id="nueva-contrasena" placeholder="Nueva contraseña" required>
                <input type="password" id="confirmar-contrasena" placeholder="Confirmar contraseña" required>
                <input type="submit" value="Cambiar contraseña">
            </div>
        </section>
        <section id="mensaje-cambio"></section>
    </form>
    <script src="Js/cambiar-contrasena.js"></script>
</body>
</html>
